name: Set up project
description: Install Node.js and pnpm (versions from .node-version and packageManager) and project dependencies

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6.1.1

    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
